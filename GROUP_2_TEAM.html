<!DOCTYPE html>   
<html lang="ar" dir="rtl">   
<head>   
  <meta charset="utf-8">   
  <meta name="viewport" content="width=device-width, initial-scale=1.0">   
  <title>GROUP 2</title>   
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>   
    :root { 
      --bg-color: #030712; 
      --card-bg: rgba(17, 24, 39, 0.75); 
      --border-color: rgba(255, 255, 255, 0.08); 
      --text-main: #f9fafb; 
      --text-muted: #6b7280; 

      --glow-color-1: #00f2fe; 
      --glow-color-2: #e056fd; 
      --glow-color-3: #10b981; 
      --led-color-4: #f1c40f; 
      --led-color-5: #ff7675; 
    } 

    * {   
      box-sizing: border-box;   
      margin: 0;   
      padding: 0;   
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;   
    }   

    body {   
      background-color: var(--bg-color);   
      color: var(--text-main);   
      display: flex;   
      flex-direction: column;   
      align-items: center;   
      justify-content: center;   
      min-height: 100vh;   
      padding: 20px;   
      position: relative;
      overflow-x: hidden;
    }   

    body::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.12) 0%, rgba(0,0,0,0) 70%);
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .team-card {   
      position: relative;
      z-index: 1;
      background: var(--card-bg);   
      backdrop-filter: blur(20px); 
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);   
      border-radius: 24px;   
      padding: 32px 28px;   
      width: 100%;   
      max-width: 480px;   
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);   
    }   

    .card-header {   
      text-align: center;   
      padding-bottom: 20px;   
      margin-bottom: 24px;   
      border-bottom: 1px solid var(--border-color);   
    }   

    .card-title { 
      font-size: 1.2rem;   
      font-weight: 800;   
      letter-spacing: 2px;   
      text-transform: uppercase; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    } 

    .card-title span {
      color: #00f2fe;
      text-shadow: 0 0 8px rgba(0, 242, 254, 0.4), 0 0 15px rgba(0, 242, 254, 0.2);
    }

    .member-list { 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    } 

    .member-item {   
      position: relative;
      border-radius: 14px; 
      overflow: hidden;
      padding: 2px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }   

    .member-item:hover { 
      transform: translateY(-2px); 
    } 

    .member-item.has-led::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 500%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        transparent 280deg,
        var(--led-color) 360deg
      );
      animation: rotateLED 3s linear infinite;
    }

    @keyframes rotateLED {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .member-content {
      position: relative;
      z-index: 2;
      width: 100%;
      display: flex;   
      justify-content: space-between;   
      align-items: center;   
      padding: 12px 16px;   
      border-radius: 12px;
      background: #0d1322;
      transition: all 0.3s ease;
    }

    .glowing-box .member-content {
      border: 1px solid var(--glow-color);
      box-shadow: inset 0 0 8px var(--glow-color), 0 0 10px var(--glow-color);
      background: linear-gradient(135deg, rgba(13, 19, 34, 0.9), rgba(13, 19, 34, 0.7));
    }

    .item-1 { --glow-color: var(--glow-color-1); }
    .item-2 { --glow-color: var(--glow-color-2); }
    .item-3 { --glow-color: var(--glow-color-3); }
    .item-4 { --led-color: var(--led-color-4); }
    .item-5 { --led-color: var(--led-color-5); }

    .member-name { 
      font-size: 0.95rem; 
      font-weight: 600; 
      color: #ffffff; 
      direction: ltr; 
      text-align: left;
    } 

    .glowing-box .member-name {
      text-shadow: 0 0 6px var(--glow-color);
    }

    .badges-group { 
      display: flex; 
      gap: 6px; 
      align-items: center; 
    } 

    .badge { 
      font-size: 0.7rem; 
      font-weight: 700; 
      padding: 5px 10px; 
      border-radius: 20px; 
      letter-spacing: 0.5px; 
      text-transform: uppercase;
    } 

    .badge-leader { 
      background: rgba(0, 242, 254, 0.2); 
      color: #00f2fe; 
      border: 1px solid rgba(0, 242, 254, 0.4); 
    } 
    
    .badge-mit { 
      background: rgba(245, 158, 11, 0.2); 
      color: #fbbf24; 
      border: 1px solid rgba(251, 191, 36, 0.4); 
    } 
    
    .badge-wokwi { 
      background: rgba(224, 86, 253, 0.2); 
      color: #e056fd; 
      border: 1px solid rgba(224, 86, 253, 0.4); 
    } 
    
    .badge-ppt { 
      background: rgba(16, 185, 129, 0.2); 
      color: #10b981; 
      border: 1px solid rgba(16, 185, 129, 0.4); 
    } 

    .footer { 
      margin-top: 24px; 
      text-align: center; 
      font-size: 0.75rem; 
      color: var(--text-muted); 
      letter-spacing: 1.5px; 
      font-weight: 600;
    } 
  </style>   
</head>   
<body>   

  <main class="team-card">   
    <header class="card-header"> 
      <h1 class="card-title"><span>GROUP 2</span></h1>   
    </header> 

    <div class="member-list"> 
      <div class="member-item glowing-box item-1">   
        <div class="member-content">
          <span class="member-name">Abdelrahman Tamer Awad</span>   
          <div class="badges-group"> 
            <span class="badge badge-leader">LEADER</span> 
            <span class="badge badge-mit">MIT APP</span> 
          </div> 
        </div>
      </div>   

      <div class="member-item glowing-box item-2">   
        <div class="member-content">
          <span class="member-name">Malak Khaled Ali Mostafa</span>   
          <span class="badge badge-wokwi">WOKWI PROJECT</span>   
        </div>
      </div>   

      <div class="member-item glowing-box item-3">   
        <div class="member-content">
          <span class="member-name">Moaz Ahmed Fayeq Foda</span>   
          <span class="badge badge-ppt">POWERPOINT</span>   
        </div>
      </div>   

      <div class="member-item has-led item-4">   
        <div class="member-content">
          <span class="member-name">Ganna Hanafy Magdy Hanafy</span>   
        </div>
      </div>   

      <div class="member-item has-led item-5">   
        <div class="member-content">
          <span class="member-name">Kenzy Hatem Mohamed Salah</span>   
        </div>
      </div>   
    </div> 

    <footer class="footer"> 
      © POWERED BY GROUP 2 
    </footer>   
  </main>   

</body>   
</html>
